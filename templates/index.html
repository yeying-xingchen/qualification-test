<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GCash Qualification</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <div class="home-admin-link"><a href="/admin">管理员后台</a></div>
    <header>
      <div class="eyebrow">PHILIPPINES · CHECKOUT QUALIFICATION</div>
      <h1>GCash 资格检测</h1>
      <p>批量使用菲律宾代理创建 PH/PHP Checkout，仅检测是否公开 GCash 渠道，不发起支付。</p>
    </header>

    <section class="card mode-card" id="modeCard" hidden><div class="mode-note">访客模式需要 CDK</div><label id="cdkField">CDK<input id="cdk" placeholder="GC-XXXX-XXXX-XXXX-XXXX"></label></section>
    <section class="card">
      <div class="grid">
        <label>Token / 账号整行（每行一条）<textarea id="tokens" placeholder="支持 JWT，也支持 email----password----...----JWT 整行格式"></textarea></label>
        <label>菲律宾代理（每行一条）<textarea id="proxies" placeholder="host:port:user:password&#10;us.1024proxy.io:3000:username:password&#10;curl -x us.1024proxy.io:3000 -U &quot;user:password&quot; ipinfo.io&#10;socks5://user:pass@ph-proxy:1080&#10;代理池会按顺序循环复用"></textarea></label>
      </div>
      <label class="check"><input id="withPromo" type="checkbox"> 同时携带优惠请求（不代表优惠资格）</label>
      <label class="preset-select">检测预设<select id="preset"><option value="gcash">菲律宾 / PHP / GCash</option><option value="card">菲律宾 / PHP / Card</option><option value="paypal_uk">英国 / GBP / PayPal</option><option value="ideal_nl">荷兰 / EUR / iDEAL</option><option value="momo_vn">越南 / VND / MoMo</option><option value="custom">自定义渠道</option></select></label><fieldset class="channel-select"><legend>同时检测渠道</legend><label><input type="checkbox" name="channels" value="gcash" checked> GCash</label><label><input type="checkbox" name="channels" value="card"> Card</label><label><input type="checkbox" name="channels" value="paypal"> PayPal</label><label><input type="checkbox" name="channels" value="ideal"> iDEAL</label><label><input type="checkbox" name="channels" value="momo"> MoMo</label></fieldset><label class="custom-channel">自定义渠道<input id="customChannel" value="gcash" placeholder="例如 card 或 gcash"></label><button id="start">开始批量检测</button>
      <span id="message"></span>
    </section>

    <section class="card stats" id="stats" hidden>
      <div><b id="total">0</b><span>总数</span></div>
      <div><b id="completed">0</b><span>已完成</span></div>
      <div><b id="qualified">0</b><span>发现 GCash</span></div>
      <div><b id="failed">0</b><span>失败</span></div>
    </section>

    <section class="card" id="resultsCard" hidden>
      <div class="toolbar"><h2>检测结果</h2><button id="export">导出 JSON</button></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>状态</th><th>账户详情</th><th>Checkout</th><th>币种</th><th>全部可用渠道</th></tr></thead><tbody id="results"></tbody></table></div>
    </section>
  <div id="accountModal" class="modal" hidden><div class="modal-panel"><button id="closeModal" class="modal-close">×</button><h2>账户详情</h2><p id="modalEmail"></p><label>Access Token<textarea id="modalToken" readonly></textarea></label><button id="copyModalToken">复制 AT</button></div></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
