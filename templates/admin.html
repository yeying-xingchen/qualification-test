<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员后台 · Qualification Desk</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main class="shell admin-shell"><a class="skip-link" href="#adminLogin">跳到登录区域</a><div class="topbar"><a class="brand-mark" href="/" aria-label="返回检测主页"><span class="brand-mark-icon">Q</span><span>Qualification Desk</span></a><a class="home-admin-link" href="/">返回检测主页 <span aria-hidden="true">↗</span></a></div><header class="hero"><div class="eyebrow">ADMIN CONSOLE</div><h1>管理员<br><em>后台</em></h1><p>登录后切换全局服务模式，主页用户不能自行更改模式。</p></header>
<section class="card"><div class="section-heading"><div><span class="section-kicker">01 · ACCESS</span><h2>管理员登录</h2></div></div><div class="admin-row"><label for="adminPassword">管理员密码<input id="adminPassword" type="password" placeholder="输入管理员密码" autocomplete="current-password"></label><button id="adminLogin" type="button">登录</button><span id="adminMessage" role="status" aria-live="polite"></span></div></section>
<section class="card" id="adminControls" aria-labelledby="modeHeading" hidden><div class="section-heading"><div><span class="section-kicker">02 · SERVICE</span><h2 id="modeHeading">服务模式</h2></div></div><p id="currentMode" class="mode-note"></p><div class="admin-row"><label for="adminMode">运行模式<select id="adminMode"><option value="self">自部署模式</option><option value="visitor">访客模式</option></select></label><button id="adminApply" type="button">应用模式</button><button id="adminLogout" type="button" class="secondary-button">退出登录</button></div></section>
<a class="back-link" href="/">返回检测主页</a></main><script src="/static/admin.js"></script></body></html>
